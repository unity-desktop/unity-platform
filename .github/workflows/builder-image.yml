name: Builder image

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 0'
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.github/workflows/builder-image.yml'

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: ${{ github.ref }}-${{ github.workflow }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          pull: true
          push: true
          no-cache: ${{ github.event_name == 'schedule' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/unity-platform-deps:latest
            ghcr.io/${{ github.repository_owner }}/unity-platform-deps:main
          outputs: type=image,compression=zstd,compression-level=19,oci-mediatypes=true,force-compression=true,rewrite-timestamp=true
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/unity-platform-deps:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/unity-platform-deps:buildcache,mode=max,compression=zstd,compression-level=12,ignore-error=true
          attests: |
            type=provenance,mode=max,builder-id=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            type=sbom,generator=docker/buildkit-syft-scanner
          labels: |
            org.opencontainers.image.source=${{ github.repository_url }}
            org.opencontainers.image.title=Unity Platform Dependencies
            org.opencontainers.image.version=latest
            org.opencontainers.image.authors=${{ github.actor }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Builder image for the Unity Platform Dependencies
            org.opencontainers.image.vendor=unity-desktop
            org.opencontainers.image.licenses=GPL-3.0-or-later
            org.opencontainers.image.base.name=ghcr.io/unity-desktop/builder:latest
