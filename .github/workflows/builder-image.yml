name: Builder image

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 0'
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.github/workflows/builder-image.yml'

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          pull: true
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/unity-platform-builder:latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/unity-platform-builder:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/unity-platform-builder:buildcache,mode=max,ignore-error=true
