name: Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - name: Install dependencies
        run: |
          dnf install -y \
            meson ninja-build gcc pkgconf-pkg-config git \
            glib2-devel gobject-introspection-devel \
            gtk4-layer-shell-devel gtk4-devel libadwaita-devel \
            gi-docgen libsystemd-devel

      - uses: actions/checkout@v4

      - name: Build documentation
        run: |
          meson setup builddir -Ddocumentation=true
          meson compile -C builddir

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: builddir/doc

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
